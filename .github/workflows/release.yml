name: Release MssqlMcp

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # ponytail: one job cross-publishes all three RIDs. Self-contained (not AOT) needs no native
    # toolchain, so a matrix of runners would only buy slower, more expensive builds.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MssqlMcp/MssqlMcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish -c Release -r "$rid" -o "out/$rid" -p:Version="$version"
          done
          # the three binaries share a name; rename before upload or they collide in the release
          mv out/win-x64/MssqlMcp.exe out/MssqlMcp-win-x64.exe
          mv out/linux-x64/MssqlMcp   out/MssqlMcp-linux-x64
          mv out/osx-arm64/MssqlMcp   out/MssqlMcp-osx-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/MssqlMcp-win-x64.exe \
            out/MssqlMcp-linux-x64 \
            out/MssqlMcp-osx-arm64 \
            --title "MSSQL MCP $GITHUB_REF_NAME" \
            --generate-notes
